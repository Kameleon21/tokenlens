version: 2
project_name: tokenlens

before:
  hooks:
    - python3 scripts/bundle_backend.py

builds:
  - main: .
    binary: tokenlens
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Version is compiled from internal/app/version.go and checked against the tag.
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/usage.md
      - docs/releases.md
      - scripts/install_release.py
      - third_party/*
      - src: '.release-backends/{{ .Os }}_{{ .Arch }}/ccusage{{ if eq .Os "windows" }}.exe{{ end }}'
        dst: 'libexec'
        strip_parent: true
        info:
          mode: 0755

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: Kameleon21
    name: tokenlens
  name_template: "Tokenlens {{ .Tag }}"
  footer: |
    ### Install

    Download the archive for your OS and architecture below and verify it against
    the SHA-256 checksums. Extract the entire archive and keep `libexec` beside
    `tokenlens` (`tokenlens.exe` on Windows). Add that directory to your PATH.
    macOS/Linux users can use `python3 scripts/install_release.py` to install
    and update the complete release with checksum verification.

    Or install with Go 1.25+:

    ```sh
    go install github.com/Kameleon21/tokenlens@{{ .Tag }}
    tokenlens --version
    tokenlens --demo
    ```

    Release archives include native ccusage and Tokenlens includes local model
    prices with background refresh. Go installations still need Bun or ccusage
    20.0.20. Demo mode uses synthetic data.
